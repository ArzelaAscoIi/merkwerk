[package]
name = "merkwerk"
version = "0.0.3"
edition = "2024"
description = "Local, open source meeting recorder and work log: auto-detects calls, transcribes, summarizes, reads your screen, serves an MCP."
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
cpal = "0.18"
hound = "3.5"
libc = "0.2"
parakeet-rs = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
whisper-rs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-application-services = { version = "0.3.2", features = ["libc"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFURL", "CFDictionary", "CFArray", "CFString", "CFNumber"] }
objc2-event-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKParticipant", "EKTypes"] }
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
whisper-rs = { version = "0.16", features = ["metal"] }

# Windows and Linux: tray icon + webview windows instead of AppKit.
[target.'cfg(not(target_os = "macos"))'.dependencies]
png = "0.17"
tao = "0.37"
trash = "5"
tray-icon = "0.26"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
