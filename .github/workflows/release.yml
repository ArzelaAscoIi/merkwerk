name: Release binaries

# Builds the Apple Silicon binary for a release in public CI and attaches it with a checksum
# and a build attestation, so anyone can check that a download was built from this repository:
#   gh attestation verify merkwerk-<tag>-aarch64-apple-darwin.tar.gz -R ArzelaAscoIi/merkwerk
# The Homebrew tap (ArzelaAscoIi/homebrew-tap) picks up new releases from here.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.0.3
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  macos:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: "14.6"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        run: |
          asset="merkwerk-${TAG}-aarch64-apple-darwin.tar.gz"
          tar -czf "$asset" -C target/release merkwerk
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
